# Vocabolario delle etichette zero-shot. Si può modificare liberamente: dopo una modifica gli embedding dei prompt
# si ricalcolano da soli (cache per hash del contenuto). `it`/`en` generano i prompt dai modelli in `patterns`;
# `cat` è la categoria; `t` (facoltativo) è una soglia di confidenza specifica; `prompts` (facoltativo) sostituisce
# i prompt generati.
patterns:
  - "una foto di {it}"
  - "a photo of {en}"

# Confidenza minima per categoria: le etichette di stile e di documento sono vaghe e attirano le immagini astratte.
category_threshold:
  Stile: 0.60
  Documenti: 0.50

